name: CodePromptus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # os: [ubuntu-latest]
    env:
      CI: true

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
              
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Display .NET information
      run: dotnet --info
        
    - name: Install requirements for Avalonia (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        bash .github/scripts/install-avalonia-deps.sh
    
    - name: Restore dependencies
      run: dotnet restore CodePromptus.sln
      
    - name: Build
      run: dotnet build CodePromptus.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test CodePromptus.sln --configuration Release --no-build --verbosity normal

    # License texts fetched from GitHub are pinned to a commit, so the cache never goes stale
    - name: Cache license texts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v4
      with:
        path: ~/.local/share/NoticeForge/cache
        key: noticeforge-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: noticeforge-

    # May we use every dependency? The lock files are the same on every OS, so one OS is enough
    - name: Check licenses of dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        dotnet tool restore
        dotnet noticeforge check -c ThirdPartyLicenses/noticeforge.json
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Upload test screenshots and logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-screenshots-and-logs-${{ matrix.os }}
        path: |
          **/TestResults/**
          **/logs/**
        if-no-files-found: warn

  publish:
    # Runs on pull requests too, so a broken publish or notices step is found before merging.
    # Only the release step at the end is limited to pushes to main.
    name: Publish and Package Artifacts
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
            10.0.x

    - name: Install requirements for Avalonia
      run: bash .github/scripts/install-avalonia-deps.sh

    - name: Get version from csproj
      id: version
      run: |
        VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' App/CodePromptus.App.csproj)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Found version: $VERSION"

    - name: Restore tools
      run: dotnet tool restore

    # License texts fetched from GitHub are pinned to a commit, so the cache never goes stale
    - name: Cache license texts
      uses: actions/cache@v4
      with:
        path: ~/.local/share/NoticeForge/cache
        key: noticeforge-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: noticeforge-

    # The notices are built per RID, because the native components differ by OS.
    # A single-file publish embeds deps.json in the executable, so the one left in obj is used.
    # set -e stops the job when a publish fails or NoticeForge reports a problem.
    - name: Publish, Build Notices and Zip All Platforms
      run: |
        set -e
        for RID in win-x64 osx-x64 linux-x64; do
          echo "Publishing for $RID"
          dotnet publish App/CodePromptus.App.csproj -c Release -r $RID --self-contained true -p:PublishSingleFile=true -o publish-$RID
          echo "Building third-party notices for $RID"
          dotnet noticeforge notices App/obj/Release/net10.0/$RID/CodePromptus.App.deps.json -c ThirdPartyLicenses/noticeforge.json -o publish-$RID/THIRD-PARTY-NOTICES.txt
          echo "Zipping build for $RID"
          cd publish-$RID
          zip -r ../CodePromptus-v${{ steps.version.outputs.version }}-$RID.zip .
          cd ..
        done
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Create Release and Upload Artifacts
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        files: |
          CodePromptus-v${{ steps.version.outputs.version }}-win-x64.zip
          CodePromptus-v${{ steps.version.outputs.version }}-osx-x64.zip
          CodePromptus-v${{ steps.version.outputs.version }}-linux-x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}